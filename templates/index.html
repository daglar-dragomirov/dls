<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM-агенты | Релевантность организаций</title>
<style>
:root{--ink:#17212b;--muted:#596670;--line:#d8e0e7;--accent:#087f5b;--bg:#f4f7f8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:var(--ink);background:var(--bg);letter-spacing:0}
header{background:#17332d;color:#fff;padding:24px max(18px,calc((100% - 1120px)/2));border-bottom:4px solid #dc765d}.topic{font-size:15px;line-height:1.6}h1{font-size:27px;margin:12px 0 0}
main{max-width:1120px;margin:22px auto;padding:0 18px 36px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}section{min-width:0}h2{font-size:18px;margin:0 0 14px}.band{grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:18px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{border-left:3px solid var(--accent);padding-left:10px}.metric b{display:block;font-size:20px}.metric span{font-size:12px;color:var(--muted)}
label{display:block;font-weight:650;font-size:13px;margin:11px 0 5px}input,textarea,select{width:100%;min-width:0;border:1px solid #b9c5cf;border-radius:5px;padding:9px 10px;font:inherit;background:#fff}textarea{min-height:78px;resize:vertical}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
button{margin-top:13px;border:0;border-radius:5px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;background:var(--accent);color:#fff}button:disabled{cursor:default;opacity:.6}button.secondary{background:#dfe8ec;color:#20323a}.actions{display:flex;flex-wrap:wrap;gap:8px}pre{margin:12px 0 0;max-height:500px;overflow:auto;background:#18201d;color:#e0ede5;border-radius:6px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.status{font-size:13px;color:var(--muted);margin-top:10px;min-height:36px}.error{color:#a22020}#verdict{font-size:22px;font-weight:700;margin:12px 0}#rationale,#evidence{line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}#sources{padding-left:20px}#sources li{margin:10px 0;overflow-wrap:anywhere}a{color:#076b99}details{margin-top:18px}summary{cursor:pointer}#result-panel{border-left:1px solid var(--line);padding-left:24px}
@media(max-width:800px){main{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}#result-panel{padding:18px 0 0;border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><div class="topic"><strong>Выбранная тема DLS: «LLM-агенты: оценка релевантности организаций запросам на Яндекс.Картах»</strong></div><h1>Релевантность организаций</h1></header>
<main><section class="band"><h2>Архивный эксперимент · июль 2026 · 570 примеров</h2><div class="metrics" id="metrics"></div></section>
<section><h2>Карточка организации</h2><form id="card-form">
<label for="query">Поисковый запрос</label><input id="query" required maxlength="500" value="ресторан с верандой">
<label for="organization_name">Название</label><input id="organization_name" required maxlength="300" value="Северный сад">
<div class="row"><div><label for="category">Рубрика</label><input id="category" maxlength="500" value="Ресторан"></div><div><label for="address">Адрес</label><input id="address" maxlength="1000" value="Москва"></div></div>
<label for="prices_summarized">Цены и услуги</label><textarea id="prices_summarized" maxlength="4000">Летнее меню, ужины, бронирование столиков</textarea>
<label for="review_snippets">Сводка отзывов</label><textarea id="review_snippets" maxlength="6000">Посетители хвалят просторную летнюю веранду, спокойную атмосферу и обслуживание.</textarea>
<div class="row"><div><label for="engine">Модель</label><select id="engine"><option value="llm">LLM-агент</option><option value="baseline">Baseline + retrieval</option></select></div><div><label for="search_mode">Поиск в интернете</label><select id="search_mode"><option value="auto">Решает агент</option><option value="always">Всегда</option><option value="off">Выключен</option></select></div></div>
<div class="actions"><button id="evaluate" type="submit">Оценить</button><button id="negative" class="secondary" type="button">Сложный пример</button></div>
<div class="status" id="status" role="status" aria-live="polite">Готов к запросу.</div></form></section>
<section id="result-panel" aria-busy="false"><h2>Решение</h2><div id="verdict">Оценки пока нет</div><p id="confidence"></p><p id="evidence"></p><p id="rationale"></p><p id="search-status"></p><ul id="sources"></ul><button id="download" class="secondary" disabled title="Скачать решение и трассу в JSON">Скачать JSON</button><details><summary>Трасса инструментов и ответ API</summary><pre id="output">Нет данных</pre></details></section>
</main><script>
const $=id=>document.getElementById(id);
const ids=['query','organization_name','category','address','prices_summarized','review_snippets'];
let result=null,busy=false;
function clearResult(){result=null;$('download').disabled=true;['confidence','evidence','rationale','search-status','sources'].forEach(id=>$(id).textContent='');$('verdict').textContent='Оценки пока нет';$('output').textContent='Нет данных';}
function stale(){if(busy)return;clearResult();$('status').textContent='Карточка изменена. Нужна новая оценка.';$('status').className='status';}
function syncMode(){const baseline=$('engine').value==='baseline';if(baseline)$('search_mode').value='off';$('search_mode').disabled=busy||baseline;}
function setBusy(value){busy=value;ids.concat(['engine','evaluate','negative']).forEach(id=>$(id).disabled=value);syncMode();$('evaluate').textContent=value?'Оцениваю…':'Оценить';$('result-panel').setAttribute('aria-busy',String(value));}
function render(data){result=data;const labels={'0':'Не соответствует','0.1':'Частичное соответствие','1':'Соответствует'};$('verdict').textContent=`${labels[String(data.predicted_relevance)]} · ${data.predicted_relevance}`;$('confidence').textContent=`${data.confidence_kind==='llm_self_assessment'?'Самооценка LLM (не калибрована)':'Вероятность класса'}: ${Number(data.confidence).toFixed(3)}`;$('evidence').textContent=data.llm_review?.evidence_summary||'';$('rationale').textContent=data.rationale;$('search-status').textContent=({ok:'Поиск выполнен. Найденные источники:',no_sources:'Поиск не дал проверяемых источников.',unavailable:'Поиск недоступен. Решение опирается на карточку.',not_requested:'Интернет-поиск не выполнялся.'})[data.search_status]||data.search_status;
 for(const source of data.sources||[]){try{const url=new URL(source.url);if(!['https:','http:'].includes(url.protocol))continue;const li=document.createElement('li'),a=document.createElement('a');a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=source.title||url.hostname;li.append(a);$('sources').append(li);}catch{}}
 $('output').textContent=JSON.stringify(data,null,2);$('download').disabled=false;
}
async function runAgent(event){event?.preventDefault();if(busy)return;for(const id of ['query','organization_name']){if(!$(id).value.trim()){$(id).setCustomValidity('Заполните поле, не только пробелами.');$(id).reportValidity();return;}}if(!$('card-form').reportValidity())return;clearResult();setBusy(true);$('status').className='status';$('status').textContent=$('engine').value==='llm'?'LLM анализирует карточку и планирует действия…':'Baseline оценивает карточку…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),240000);try{const body=Object.fromEntries(ids.map(id=>[id,$(id).value]));body.use_llm=$('engine').value==='llm';body.search_mode=$('search_mode').value;const response=await fetch('/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'Проверьте заполнение и длину полей.');render(data);$('status').textContent=`Готово: класс ${data.predicted_relevance}`;if(window.innerWidth<=800)$('result-panel').scrollIntoView({behavior:'smooth',block:'start'});}catch(error){$('status').className='status error';$('status').textContent=error.name==='AbortError'?'Время ожидания истекло. Сервер мог продолжить запрос; не повторяйте его сразу.':`Ошибка: ${error.message}`;$('output').textContent=$('status').textContent;}finally{clearTimeout(timer);setBusy(false);}}
$('card-form').addEventListener('submit',runAgent);
ids.forEach(id=>$(id).addEventListener('input',()=>{$(id).setCustomValidity('');stale();}));['engine','search_mode'].forEach(id=>$(id).addEventListener('change',()=>{stale();syncMode();}));
$('negative').addEventListener('click',()=>{const values=['кальянная для мероприятий','PioNero','Кафе','Санкт-Петербург','Пицца, паста, завтраки и десерты','Отзывы хвалят итальянскую кухню и уют, но кальяны не упоминаются.'];ids.forEach((id,i)=>$(id).value=values[i]);ids.forEach(id=>$(id).setCustomValidity(''));stale();});
$('download').addEventListener('click',()=>{if(!result)return;const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='relevance_result.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
fetch('/capabilities').then(r=>r.json()).then(c=>{if(!c.llm_available&&!busy)$('status').textContent='LLM не настроена на сервере. Доступен режим Baseline.';}).catch(()=>{});
fetch('/metrics').then(r=>r.json()).then(m=>{const e=m.official_eval||{},l=m.official_llm?.metrics||{};const values=[['Baseline: accuracy',e.baseline?.accuracy],['LLM: accuracy',l.accuracy],['LLM: macro F1',l.macro_f1],['Валидный JSON',m.official_llm?.structured_output_rate]];for(const [label,value] of values){const box=document.createElement('div'),b=document.createElement('b'),span=document.createElement('span');box.className='metric';b.textContent=value==null?'—':Number(value).toFixed(3);span.textContent=label;box.append(b,span);$('metrics').append(box);}}).catch(()=>{$('metrics').textContent='Архив метрик недоступен.';});
</script></body></html>
